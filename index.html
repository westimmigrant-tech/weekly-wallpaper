<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>每周壁纸</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c0d10;
    --panel: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.11);
    --text: rgba(255,255,255,.9);
    --muted: rgba(255,255,255,.5);
    --dim: rgba(255,255,255,.3);
    --accent: #d8b45f;
    --accent-soft: rgba(216,180,95,.14);
    --shadow: 0 30px 90px rgba(0,0,0,.46);
    --sans: "Noto Sans SC", ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    --serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "STSong", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    background:
      radial-gradient(circle at 16% -4%, rgba(216,180,95,.10), transparent 30rem),
      radial-gradient(circle at 92% 18%, rgba(110,130,190,.10), transparent 34rem),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 36px 18px 64px;
  }

  button, input, textarea, select { font: inherit; }

  .app {
    width: min(1140px, 100%);
    display: grid;
    grid-template-columns: minmax(330px, 470px) minmax(320px, 1fr);
    gap: 28px;
    align-items: start;
  }

  .studio, .previewCard {
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
    box-shadow: var(--shadow);
    border-radius: 30px;
    backdrop-filter: blur(26px);
  }

  .studio { padding: 30px 30px 34px; }

  .brand { margin-bottom: 26px; }
  .brand h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .22em;
  }
  .brand p {
    margin-top: 11px;
    color: var(--muted);
    font-size: 13.5px;
    letter-spacing: .04em;
    line-height: 1.5;
  }

  .secHead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 26px 0 14px;
  }
  .secHead:first-of-type { margin-top: 0; }
  .secHead strong {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--text);
  }
  .secHead span { color: var(--dim); font-size: 12px; letter-spacing: .02em; }

  .themeGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .themeBtn {
    cursor: pointer;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: transparent;
    padding: 8px 8px 10px;
    display: grid;
    justify-items: center;
    gap: 8px;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .themeBtn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.26); }
  .themeBtn.active { border-color: var(--accent); background: var(--accent-soft); }
  .themeBtn canvas {
    width: 100%;
    aspect-ratio: 1170 / 2532;
    border-radius: 9px;
    display: block;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  .themeBtn .tname {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .themeBtn.active .tname { color: var(--text); }

  .field { margin-top: 14px; }
  input, textarea {
    width: 100%;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 15px;
    background: rgba(0,0,0,.24);
    color: var(--text);
    outline: none;
    padding: 14px 15px;
    font-family: var(--serif);
    font-size: 15.5px;
    letter-spacing: .02em;
    transition: border-color .18s ease, background .18s ease;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.7; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,.26); font-family: var(--serif); }
  input:focus, textarea:focus { border-color: var(--accent); background: rgba(0,0,0,.3); }

  .list { display: grid; gap: 9px; }
  .row { display: grid; grid-template-columns: 1fr 46px; gap: 9px; align-items: stretch; }
  .removeBtn, .addBtn {
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    border-radius: 14px;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
  }
  .removeBtn { font-size: 19px; line-height: 1; }
  .addBtn { width: 100%; height: 46px; margin-top: 11px; letter-spacing: .16em; font-size: 13.5px; }
  .removeBtn:hover, .addBtn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .addBtn:disabled { opacity: .4; cursor: not-allowed; }

  .toggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .toggleRow .lbl { font-family: var(--serif); font-size: 14px; letter-spacing: .1em; color: var(--muted); }
  .switch { position: relative; width: 48px; height: 28px; cursor: pointer; flex: none; }
  .switch input { display: none; }
  .switch .track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid var(--line);
    transition: background .2s ease, border-color .2s ease;
  }
  .switch .knob {
    position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 999px;
    background: var(--muted);
    transition: transform .2s ease, background .2s ease;
  }
  .switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent); }
  .switch input:checked + .track + .knob { transform: translateX(20px); background: var(--accent); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; }
  .primary, .secondary {
    height: 52px;
    border-radius: 15px;
    cursor: pointer;
    letter-spacing: .18em;
    font-size: 14px;
    transition: transform .18s ease, filter .18s ease, border-color .18s ease, color .18s ease;
  }
  .primary { border: 1px solid var(--accent); color: #14130f; background: var(--accent); font-weight: 700; }
  .secondary { border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.04); }
  .primary:hover, .secondary:hover { transform: translateY(-1px); }
  .secondary:hover { border-color: var(--accent); color: var(--accent); }

  .previewCard {
    position: sticky;
    top: 24px;
    padding: 26px;
    display: grid;
    justify-items: center;
    gap: 18px;
  }
  .phoneShell {
    padding: 13px;
    border-radius: 40px;
    background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 26px 80px rgba(0,0,0,.5);
  }
  canvas#wallpaper {
    display: block;
    width: min(330px, 64vw);
    aspect-ratio: 1170 / 2532;
    border-radius: 28px;
    background: #111;
  }
  .previewMeta {
    color: var(--dim);
    font: 500 12px/1.6 var(--sans);
    letter-spacing: .08em;
    text-align: center;
  }
  .previewActions { display: flex; gap: 11px; flex-wrap: wrap; justify-content: center; }
  .smallBtn {
    min-width: 134px; height: 44px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    cursor: pointer;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
    font-size: 13px; letter-spacing: .12em;
  }
  .smallBtn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  @media (max-width: 880px) {
    body { padding-top: 22px; }
    .app { grid-template-columns: 1fr; }
    .previewCard { position: static; }
    canvas#wallpaper { width: min(330px, 80vw); }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="studio" aria-label="壁纸设置">
      <div class="brand">
        <h1>每周壁纸</h1>
        <p>把本周最重要的事，安静地放在锁屏上。</p>
      </div>

      <div class="secHead"><strong>气质</strong><span>选一个方向</span></div>
      <div class="themeGrid" id="themeGrid"></div>

      <div class="secHead"><strong>主目标</strong><span>本周唯一关键的事</span></div>
      <textarea id="mainGoal" maxlength="40" placeholder="例如：完成第三章的悬疑推进设计。"></textarea>

      <div class="secHead"><strong>辅助目标</strong><span>最多 3 条</span></div>
      <div class="list" id="goalList"></div>
      <button class="addBtn" id="addGoal" type="button">＋ 添加一条</button>

      <div class="secHead"><strong>寄语</strong><span>可选</span></div>
      <input id="motto" maxlength="24" placeholder="例如：不要等灵感，先坐下来。" />

      <div class="toggleRow">
        <span class="lbl">显示周数</span>
        <label class="switch">
          <input type="checkbox" id="showWeek" />
          <span class="track"></span>
          <span class="knob"></span>
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="generateBtn" type="button">生成</button>
        <button class="secondary" id="resetBtn" type="button">重置</button>
      </div>
    </section>

    <aside class="previewCard" aria-label="壁纸预览">
      <div class="phoneShell">
        <canvas id="wallpaper" width="1170" height="2532"></canvas>
      </div>
      <div class="previewMeta" id="previewMeta">1170 × 2532 · PNG · iPhone 壁纸比例</div>
      <div class="previewActions">
        <button class="smallBtn" id="downloadBtn" type="button">保存图片</button>
        <button class="smallBtn" id="randomBtn" type="button">随机一个</button>
      </div>
    </aside>
  </main>

<script>
(() => {
  const W = 1170, H = 2532;
  const MX = 110, CW = W - MX * 2;
  const SERIF = `"Noto Serif SC", "Songti SC", "Source Han Serif SC", "STSong", serif`;

  // ---- 六个完整美学方向 ----
  const THEMES = [
    {
      id: "paper", name: "宣纸", motif: "paper", light: true,
      bg: ["#f3ebda", "#ece1ca", "#e3d6bb"],
      text: "#262019", sub: "rgba(38,32,25,.62)", dim: "rgba(38,32,25,.4)", accent: "#a8392c"
    },
    {
      id: "peaks", name: "远岫", motif: "mountains", light: false,
      bg: ["#243a55", "#365067", "#5d7587", "#94a8af"],
      text: "#f4f5f1", sub: "rgba(244,245,241,.74)", dim: "rgba(244,245,241,.5)", accent: "#ecd2a0"
    },
    {
      id: "night", name: "夜", motif: "night", light: false,
      bg: ["#0a0c11", "#0f131b", "#161c27"],
      text: "#eaecf2", sub: "rgba(234,236,242,.64)", dim: "rgba(234,236,242,.38)", accent: "#aeb9d0"
    },
    {
      id: "sand", name: "暖砂", motif: "sand", light: true,
      bg: ["#eedcc2", "#e7caa3", "#dcb486"],
      text: "#46331f", sub: "rgba(70,51,31,.62)", dim: "rgba(70,51,31,.42)", accent: "#bd4b2a"
    },
    {
      id: "pine", name: "松墨", motif: "pine", light: false,
      bg: ["#0c1411", "#13211a", "#1b3025"],
      text: "#e7efe7", sub: "rgba(231,239,231,.66)", dim: "rgba(231,239,231,.4)", accent: "#cdb072"
    },
    {
      id: "celadon", name: "霁青", motif: "celadon", light: true,
      bg: ["#d6ded7", "#c3d1cb", "#aec1bb"],
      text: "#27322e", sub: "rgba(39,50,46,.64)", dim: "rgba(39,50,46,.42)", accent: "#356458"
    },
    {
      id: "wine", name: "绛", motif: "ember", light: false,
      bg: ["#170809", "#27110f", "#3a1a17", "#1d0c0c"],
      text: "#f2ddd5", sub: "rgba(242,221,213,.66)", dim: "rgba(242,221,213,.4)", accent: "#dba06a"
    },
    {
      id: "dawn", name: "晨曦", motif: "dawn", light: true,
      bg: ["#c6cad9", "#d9cfcf", "#edd0bd", "#f4d6b2"],
      text: "#3a322c", sub: "rgba(58,50,44,.62)", dim: "rgba(58,50,44,.42)", accent: "#cc7a55"
    },
    {
      id: "frost", name: "霜", motif: "frost", light: true,
      bg: ["#eef1f5", "#e6eaf0", "#dce1e9"],
      text: "#2b3036", sub: "rgba(43,48,54,.6)", dim: "rgba(43,48,54,.4)", accent: "#5d6e7e"
    },
    {
      id: "indigo", name: "绀青", motif: "indigo", light: false,
      bg: ["#0a0e22", "#121835", "#1d264d", "#0e132b"],
      text: "#e7eaf6", sub: "rgba(231,234,246,.66)", dim: "rgba(231,234,246,.4)", accent: "#b9c4ee"
    },
    {
      id: "zen", name: "砂庭", motif: "zen", light: true,
      bg: ["#e6e2da", "#ddd7cc", "#d2ccbe"],
      text: "#33302a", sub: "rgba(51,48,42,.6)", dim: "rgba(51,48,42,.4)", accent: "#8a6d4b"
    },
    {
      id: "aster", name: "紫苑", motif: "aster", light: true,
      bg: ["#dcd7e6", "#cfc7dd", "#bcb2cf"],
      text: "#322c3d", sub: "rgba(50,44,61,.62)", dim: "rgba(50,44,61,.42)", accent: "#6a5a8c"
    }
  ];

  const DEFAULTS = {
    themeIndex: 0,
    mainGoal: "完成本周最重要的推进，不被琐事稀释注意力。",
    goals: ["整理一个可复用的工作流", "完成三次稳定运动", "留出两晚做深度阅读"],
    motto: "把注意力交给真正重要的事。",
    showWeek: true
  };

  const state = loadState();
  const els = {
    themeGrid: document.getElementById("themeGrid"),
    mainGoal: document.getElementById("mainGoal"),
    goalList: document.getElementById("goalList"),
    motto: document.getElementById("motto"),
    showWeek: document.getElementById("showWeek"),
    canvas: document.getElementById("wallpaper"),
    generateBtn: document.getElementById("generateBtn"),
    resetBtn: document.getElementById("resetBtn"),
    downloadBtn: document.getElementById("downloadBtn"),
    randomBtn: document.getElementById("randomBtn"),
    previewMeta: document.getElementById("previewMeta")
  };
  const thumbCanvases = [];

  function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem("weeklyWallpaperV3") || "null");
      return saved ? { ...cloneDefaults(), ...saved } : cloneDefaults();
    } catch (e) { return cloneDefaults(); }
  }
  function saveState() { localStorage.setItem("weeklyWallpaperV3", JSON.stringify(state)); }

  function getISOInfo(date = new Date()) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const isoYear = d.getUTCFullYear();
    const yearStart = new Date(Date.UTC(isoYear, 0, 1));
    const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return { year: isoYear, week };
  }
  function weekLabel() {
    const { year, week } = getISOInfo();
    return `${year} · 第 ${week} 周`;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function setLS(ctx, px) { try { ctx.letterSpacing = px + "px"; } catch (e) {} }

  // ---------- canvas helpers ----------
  function drawGrain(ctx, opacity, strength) {
    const step = 2, cols = Math.ceil(W / step), rows = Math.ceil(H / step);
    const image = ctx.createImageData(cols, rows);
    for (let i = 0; i < image.data.length; i += 4) {
      const n = 128 + (Math.random() - .5) * strength;
      image.data[i] = image.data[i + 1] = image.data[i + 2] = n;
      image.data[i + 3] = 255 * opacity;
    }
    const grain = document.createElement("canvas");
    grain.width = cols; grain.height = rows;
    grain.getContext("2d").putImageData(image, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(grain, 0, 0, W, H);
    ctx.restore();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
    const source = String(text || "").replace(/\s+/g, " ").trim();
    if (!source) return { yEnd: y, lines: 0 };
    const chars = [...source];
    let line = "", lines = [];
    for (const ch of chars) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = ch;
        if (lines.length === maxLines) break;
      } else { line = test; }
    }
    if (lines.length < maxLines && line) lines.push(line);
    const joined = lines.join("");
    if (lines.length === maxLines && joined.length < chars.length) {
      lines[maxLines - 1] = lines[maxLines - 1].replace(/[，。；、,.!?！？\s]*$/, "") + "…";
    }
    lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
    return { yEnd: y + Math.max(0, lines.length - 1) * lineHeight, lines: lines.length };
  }

  // ---------- motifs (drawn in full 1170×2532 space) ----------
  const MOTIF = {
    paper(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = "multiply";
      const g = ctx.createLinearGradient(0, H * .6, 0, H);
      g.addColorStop(0, "rgba(44,36,26,0)");
      g.addColorStop(1, "rgba(44,36,26,.12)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, H * .87);
      for (let x = 0; x <= W; x += 60) ctx.lineTo(x, H * .87 + Math.sin(x / 190) * 42 - Math.cos(x / 320) * 26);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(44,36,26,.05)"; ctx.lineWidth = 1;
      for (let i = 0; i < 9; i++) {
        ctx.beginPath();
        const y = H * .1 + i * H * .085;
        ctx.moveTo(-20, y);
        ctx.bezierCurveTo(W * .3, y - 44, W * .6, y + 54, W + 20, y - 12);
        ctx.stroke();
      }
      ctx.restore();
    },
    mountains(ctx) {
      ctx.save();
      const mx = W * .72, my = H * .29, r = 150;
      ctx.globalCompositeOperation = "screen";
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, r * 3.2);
      g.addColorStop(0, "rgba(236,210,160,.5)");
      g.addColorStop(.28, "rgba(236,210,160,.14)");
      g.addColorStop(1, "rgba(236,210,160,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(245,238,216,.92)";
      ctx.beginPath(); ctx.arc(mx, my, r * .6, 0, 7); ctx.fill();
      const ridges = [[.50, 60, "rgba(46,66,92,.40)"], [.60, 90, "rgba(32,50,74,.55)"], [.71, 120, "rgba(20,36,58,.72)"], [.83, 150, "rgba(10,20,36,.92)"]];
      ridges.forEach(([fy, amp, col], idx) => {
        ctx.fillStyle = col; ctx.beginPath();
        const base = H * fy; ctx.moveTo(0, base);
        for (let x = 0; x <= W; x += 40) ctx.lineTo(x, base + Math.sin(x / 170 + idx * 1.7) * amp * .5 + Math.cos(x / 300 + idx) * amp * .4);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      });
      ctx.restore();
    },
    night(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const mx = W * .78, my = H * .15;
      const g = ctx.createRadialGradient(mx, my, 0, mx, my, 540);
      g.addColorStop(0, "rgba(150,165,200,.2)");
      g.addColorStop(1, "rgba(150,165,200,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const rng = mulberry32(7);
      ctx.fillStyle = "rgba(220,225,240,1)";
      for (let i = 0; i < 30; i++) {
        ctx.globalAlpha = .18 + rng() * .5;
        ctx.beginPath();
        ctx.arc(rng() * W, rng() * H * .62, rng() * 1.7 + .5, 0, 7);
        ctx.fill();
      }
      ctx.restore();
    },
    sand(ctx) {
      ctx.save();
      const sx = W * .72, sy = H * .2;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 780);
      g.addColorStop(0, "rgba(255,242,216,.6)");
      g.addColorStop(.5, "rgba(255,228,188,.18)");
      g.addColorStop(1, "rgba(255,228,188,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "multiply";
      const dg = ctx.createLinearGradient(0, H * .7, 0, H);
      dg.addColorStop(0, "rgba(120,80,46,0)");
      dg.addColorStop(1, "rgba(120,80,46,.13)");
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.moveTo(0, H * .82);
      for (let x = 0; x <= W; x += 80) ctx.lineTo(x, H * .82 + Math.sin(x / 260) * 46);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    pine(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 4; i++) {
        const y = H * (.2 + i * .13);
        const g = ctx.createLinearGradient(0, y - 130, 0, y + 130);
        g.addColorStop(0, "rgba(180,205,180,0)");
        g.addColorStop(.5, "rgba(180,205,180,.05)");
        g.addColorStop(1, "rgba(180,205,180,0)");
        ctx.fillStyle = g; ctx.fillRect(0, y - 130, W, 260);
      }
      const rng = mulberry32(42);
      for (let i = 0; i < 5; i++) {
        const x = W * (.12 + i * .19) + rng() * 30;
        ctx.fillStyle = `rgba(205,176,114,${.045 + rng() * .03})`;
        ctx.fillRect(x, H * .08, 2.4, H * .7);
      }
      ctx.restore();
    },
    celadon(ctx) {
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const cx = W * (.3 + i * .26), cy = H * (.2 + i * .14), rx = 540, ry = 165;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
        g.addColorStop(0, "rgba(246,251,248,.42)");
        g.addColorStop(1, "rgba(246,251,248,0)");
        ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = "multiply";
      const dg = ctx.createLinearGradient(0, H * .66, 0, H);
      dg.addColorStop(0, "rgba(40,70,62,0)");
      dg.addColorStop(1, "rgba(40,70,62,.14)");
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.moveTo(0, H * .8);
      for (let x = 0; x <= W; x += 70) ctx.lineTo(x, H * .8 + Math.sin(x / 200) * 54 - Math.cos(x / 120) * 26);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    ember(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const g = ctx.createRadialGradient(W * .5, H * .8, 0, W * .5, H * .8, 880);
      g.addColorStop(0, "rgba(196,74,56,.3)");
      g.addColorStop(.5, "rgba(150,46,40,.1)");
      g.addColorStop(1, "rgba(150,46,40,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const rng = mulberry32(13);
      for (let i = 0; i < 64; i++) {
        ctx.fillStyle = `rgba(232,156,112,${.05 + rng() * .18})`;
        ctx.beginPath(); ctx.arc(rng() * W, H * (.4 + rng() * .55), rng() * 2.2 + .5, 0, 7); ctx.fill();
      }
      ctx.restore();
    },
    dawn(ctx) {
      ctx.save();
      const g = ctx.createRadialGradient(W * .5, H * .94, 0, W * .5, H * .94, 980);
      g.addColorStop(0, "rgba(255,226,190,.62)");
      g.addColorStop(.5, "rgba(255,206,178,.2)");
      g.addColorStop(1, "rgba(255,206,178,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 3; i++) {
        const y = H * (.5 + i * .12);
        const bg = ctx.createLinearGradient(0, y - 90, 0, y + 90);
        bg.addColorStop(0, "rgba(255,228,200,0)");
        bg.addColorStop(.5, "rgba(255,228,200,.12)");
        bg.addColorStop(1, "rgba(255,228,200,0)");
        ctx.fillStyle = bg; ctx.fillRect(0, y - 90, W, 180);
      }
      ctx.restore();
    },
    frost(ctx) {
      ctx.save();
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "rgba(196,212,230,.28)");
      g.addColorStop(1, "rgba(196,212,230,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const rng = mulberry32(21);
      for (let i = 0; i < 64; i++) {
        const x = rng() * W, y = rng() * H, r = rng() * 3 + 1;
        ctx.fillStyle = `rgba(255,255,255,${.35 + rng() * .5})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(150,165,185,${.05 + rng() * .08})`;
        ctx.beginPath(); ctx.arc(x + r, y + r, r * .6, 0, 7); ctx.fill();
      }
      ctx.restore();
    },
    indigo(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const g = ctx.createRadialGradient(W * .5, H * .2, 0, W * .5, H * .2, 780);
      g.addColorStop(0, "rgba(96,116,196,.22)");
      g.addColorStop(1, "rgba(96,116,196,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const rng = mulberry32(57);
      for (let i = 0; i < 92; i++) {
        ctx.globalAlpha = .15 + rng() * .5;
        ctx.fillStyle = "rgba(212,222,248,1)";
        ctx.beginPath(); ctx.arc(rng() * W, rng() * H, rng() * 1.4 + .3, 0, 7); ctx.fill();
      }
      ctx.restore();
    },
    zen(ctx) {
      ctx.save();
      const cx = W * .74, cy = H * .7;
      ctx.strokeStyle = "rgba(120,104,82,.11)"; ctx.lineWidth = 2.4;
      for (let r = 86; r < 1560; r += 70) {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = "rgba(92,82,66,.2)";
      ctx.beginPath(); ctx.ellipse(cx, cy, 44, 32, 0, 0, 7); ctx.fill();
      ctx.restore();
    },
    aster(ctx) {
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const cx = W * (.3 + i * .26), cy = H * (.22 + i * .15), rx = 540, ry = 175;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
        g.addColorStop(0, "rgba(236,228,250,.42)");
        g.addColorStop(1, "rgba(236,228,250,0)");
        ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
  };

  function drawBg(ctx, t, grain) {
    const g = ctx.createLinearGradient(0, 0, W * .15, H);
    t.bg.forEach((c, i) => g.addColorStop(i / (t.bg.length - 1), c));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); MOTIF[t.motif](ctx); ctx.restore();
    if (grain) drawGrain(ctx, t.light ? .05 : .045, t.light ? 22 : 16);
    const v = ctx.createRadialGradient(W * .5, H * .42, H * .12, W * .5, H * .5, H * .8);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, t.light ? "rgba(58,44,26,.12)" : "rgba(0,0,0,.42)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  function drawForeground(ctx, t, st) {
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

    // 主目标 —— 周数作为引子
    ctx.save();
    ctx.globalAlpha = .85; ctx.fillStyle = t.accent;
    ctx.fillRect(MX, 956, 38, 3);
    ctx.globalAlpha = 1;
    setLS(ctx, 9);
    const { week } = getISOInfo();
    ctx.fillStyle = t.sub; ctx.font = `500 28px ${SERIF}`;
    ctx.fillText(st.showWeek ? `第 ${week} 周` : "本 周", MX, 1010);
    setLS(ctx, 0);
    const hero = (st.mainGoal || "").trim() || "写下本周唯一关键的事";
    const hl = [...hero].length;
    const heroSize = hl > 30 ? 60 : hl > 20 ? 68 : 76;
    ctx.fillStyle = t.text; ctx.font = `500 ${heroSize}px ${SERIF}`;
    const hr = wrapText(ctx, hero, MX, 1110, CW, heroSize * 1.42, 3);
    ctx.restore();

    // 辅助目标
    const sup = (st.goals || []).map(s => s.trim()).filter(Boolean).slice(0, 3);
    let sy = hr.yEnd + 168;
    ctx.save();
    sup.forEach(g => {
      ctx.fillStyle = t.accent; ctx.globalAlpha = .85;
      ctx.fillRect(MX, sy - 16, 30, 3);
      ctx.globalAlpha = 1; ctx.fillStyle = t.sub;
      ctx.font = `400 40px ${SERIF}`;
      const r = wrapText(ctx, g, MX + 62, sy, CW - 62, 56, 2);
      sy = r.yEnd + 80;
    });
    ctx.restore();

    // 寄语（提至中下部，随内容自适应）
    const m = (st.motto || "").trim();
    if (m) {
      const dashY = Math.min(2230, Math.max(1880, sy + 70));
      ctx.save();
      ctx.fillStyle = t.accent; ctx.globalAlpha = .8;
      ctx.fillRect(MX, dashY, 30, 3);
      ctx.globalAlpha = 1; ctx.fillStyle = t.dim;
      ctx.font = `300 36px ${SERIF}`;
      wrapText(ctx, m, MX, dashY + 78, CW, 50, 2);
      ctx.restore();
    }
  }

  function paint(ctx, st, grain) {
    drawBg(ctx, THEMES[st.themeIndex], grain);
    drawForeground(ctx, THEMES[st.themeIndex], st);
  }

  // ---------- render ----------
  function generate() {
    const ctx = els.canvas.getContext("2d");
    els.canvas.width = W; els.canvas.height = H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    paint(ctx, state, true);
    paintThumbs();
    els.previewMeta.textContent = `${weekLabel()} · 1170 × 2532 PNG`;
  }

  function paintThumbs() {
    thumbCanvases.forEach((cv, i) => {
      const ctx = cv.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.scale(cv.width / W, cv.height / H);
      paint(ctx, { ...state, themeIndex: i }, false);
    });
  }

  function renderThemes() {
    els.themeGrid.innerHTML = "";
    thumbCanvases.length = 0;
    THEMES.forEach((t, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `themeBtn${i === state.themeIndex ? " active" : ""}`;
      const cv = document.createElement("canvas");
      cv.width = 220; cv.height = 476;
      const name = document.createElement("span");
      name.className = "tname"; name.textContent = t.name;
      btn.append(cv, name);
      btn.addEventListener("click", () => {
        state.themeIndex = i; saveState();
        setStudioAccent(); renderThemes(); generate();
      });
      els.themeGrid.appendChild(btn);
      thumbCanvases.push(cv);
    });
  }

  function renderGoals() {
    els.goalList.innerHTML = "";
    state.goals.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "row";
      const input = document.createElement("input");
      input.value = item; input.maxLength = 26;
      input.placeholder = `辅助目标 ${index + 1}`;
      input.addEventListener("input", () => { state.goals[index] = input.value; saveState(); generate(); });
      const remove = document.createElement("button");
      remove.type = "button"; remove.className = "removeBtn";
      remove.textContent = "×"; remove.setAttribute("aria-label", "删除");
      remove.addEventListener("click", () => {
        state.goals.splice(index, 1);
        if (!state.goals.length) state.goals.push("");
        saveState(); renderGoals(); generate();
      });
      row.append(input, remove);
      els.goalList.appendChild(row);
    });
    document.getElementById("addGoal").disabled = state.goals.length >= 3;
  }

  function setStudioAccent() {
    const t = THEMES[state.themeIndex];
    document.documentElement.style.setProperty("--accent", t.accent);
    const c = t.accent.replace("#", "");
    const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    document.documentElement.style.setProperty("--accent-soft", `rgba(${r},${g},${b},.16)`);
  }

  function bindFields() {
    els.mainGoal.value = state.mainGoal;
    els.motto.value = state.motto;
    els.showWeek.checked = state.showWeek;

    els.mainGoal.addEventListener("input", () => { state.mainGoal = els.mainGoal.value; saveState(); generate(); });
    els.motto.addEventListener("input", () => { state.motto = els.motto.value; saveState(); generate(); });
    els.showWeek.addEventListener("change", () => { state.showWeek = els.showWeek.checked; saveState(); generate(); });

    document.getElementById("addGoal").addEventListener("click", () => {
      if (state.goals.length < 3) state.goals.push("");
      saveState(); renderGoals(); generate();
    });
    els.generateBtn.addEventListener("click", generate);
    els.resetBtn.addEventListener("click", () => {
      Object.assign(state, cloneDefaults());
      saveState(); renderAll(); generate();
    });
    els.randomBtn.addEventListener("click", () => {
      let next = Math.floor(Math.random() * THEMES.length);
      if (next === state.themeIndex) next = (next + 1) % THEMES.length;
      state.themeIndex = next; saveState();
      setStudioAccent(); renderThemes(); generate();
    });
    els.downloadBtn.addEventListener("click", download);
  }

  function renderAll() {
    setStudioAccent();
    renderThemes();
    renderGoals();
    els.mainGoal.value = state.mainGoal;
    els.motto.value = state.motto;
    els.showWeek.checked = state.showWeek;
  }

  function download() {
    generate();
    const a = document.createElement("a");
    const { year, week } = getISOInfo();
    a.download = `weekly-wallpaper-${year}-W${String(week).padStart(2, "0")}.png`;
    a.href = els.canvas.toDataURL("image/png");
    a.click();
  }

  renderAll();
  bindFields();

  async function boot() {
    if (document.fonts && document.fonts.load) {
      try {
        await Promise.all([
          document.fonts.load('300 80px "Noto Serif SC"'),
          document.fonts.load('400 80px "Noto Serif SC"'),
          document.fonts.load('500 80px "Noto Serif SC"'),
          document.fonts.load('600 40px "Noto Serif SC"')
        ]);
        await document.fonts.ready;
      } catch (e) {}
    }
    generate();
  }
  generate();
  boot();
})();
</script>
</body>
</html>
